name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: go generate ./...
      - run: git diff --exit-code -- data.bin.gz dist
      - run: go test -race ./...
      - run: go vet ./...
      - run: node --experimental-strip-types --test frontend/*.test.mjs
